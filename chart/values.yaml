replicaCount: 1

image:
  repository: ghcr.io/rocketpadplatforms/rpp-website
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""
fullnameOverride: ""

# Kubernetes envFrom list, e.g. [{secretRef: {name: my-secret}}]. The app needs
# no configuration, so this is empty by default.
envFrom: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials? The app never
  # talks to the Kubernetes API, so a token in the pod would only be a risk.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# The image runs as the `node` user (uid 1000) and writes nothing to disk, so it
# supports the full restricted profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# A server-rendered site whose platform catalog is baked into static JSON at
# build time. No CPU limit, so template rendering can burst; memory is capped.
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
