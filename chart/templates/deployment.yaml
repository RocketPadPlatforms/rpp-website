apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketpadplatforms-website.fullname" . }}
  labels:
    {{- include "rocketpadplatforms-website.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rocketpadplatforms-website.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rocketpadplatforms-website.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rocketpadplatforms-website.serviceAccountName" . }}
      # Also set on the pod, so it holds when serviceAccount.create is false
      # and an existing account that does automount is used instead.
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /healthz answers without rendering a template or touching the
          # filesystem.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
